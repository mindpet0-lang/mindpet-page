<div class="perfil-bg">

  <div class="perfil-overlay">

    <!-- 🔙 BOTÓN VOLVER -->
    <div class="back-button" (click)="volver()">
      <span class="material-icons">arrow_back</span>
    </div>

    <h1 class="title">Ajustes</h1>

    <div class="perfil-cards">

      <!-- 👤 PERFIL -->
      <div class="perfil-card">

        <!-- 🖼 FOTO -->
        <div class="avatar-container">
          <img 
            [src]="preview || '/assets/images/default-user.png'" 
            class="avatar"
          >

          <!-- 📸 BOTÓN SOBRE LA FOTO -->
          <label class="upload-btn">
            <span class="material-icons">photo_camera</span>
            <input type="file" (change)="onFileSelected($event)">
          </label>
        </div>

        <!-- 📝 FORM -->
<form [formGroup]="perfilForm" (ngSubmit)="actualizarPerfil()">
  <input type="text" formControlName="nombre" placeholder="Tu nombre">

  <div *ngIf="perfilForm.get('nombre')?.touched && perfilForm.get('nombre')?.errors?.['required']" class="error-text">
    El nombre es obligatorio y no puede estar vacío.
  </div>

  <button type="submit" [disabled]="perfilForm.invalid">Guardar cambios</button>
</form>
      </div>

      <!-- 🔒 SEGURIDAD -->
<div class="perfil-card">
  <h3>Seguridad</h3>

  <form [formGroup]="passwordForm" (ngSubmit)="cambiarPassword()">
    
    <input type="password" formControlName="actual" placeholder="Contraseña actual">
    <div *ngIf="passwordForm.get('actual')?.touched && passwordForm.get('actual')?.errors?.['required']" class="error-text">
      La contraseña actual es obligatoria.
    </div>

    <input type="password" formControlName="nueva" placeholder="Nueva contraseña">
    
    <div *ngIf="passwordForm.get('nueva')?.touched && passwordForm.get('nueva')?.errors" class="error-container">
      <small *ngIf="passwordForm.get('nueva')?.errors?.['required']" class="error-text">
        La nueva contraseña es obligatoria.
      </small>
      <small *ngIf="passwordForm.get('nueva')?.errors?.['minlength']" class="error-text">
        Debe tener un mínimo de 8 caracteres.
      </small>
      <small *ngIf="passwordForm.get('nueva')?.errors?.['pattern']" class="error-text">
        Debe contener al menos una letra mayúscula.
      </small>
    </div>

    <button type="submit" [disabled]="passwordForm.invalid">Actualizar contraseña</button>
  </form>
</div>
    </div>

  </div>

</div>
